<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Tool</title>
<style>
  :root {
    --bg: #0b0c0e;
    --panel: #16181c;
    --line: #262a30;
    --text: #e8e9eb;
    --muted: #8a8f98;
    --accent: #d7d2c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    min-height: 100vh;
    padding: 14px 16px 60px;
  }
  .layout {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    max-width: 960px;
    margin: 0 auto;
  }
  .stage-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  canvas {
    width: min(320px, 80vw);
    /* aspect-ratio is set from JS (applyAspectRatio) to match whichever
       preset is selected - canvas.width/height are the source of truth,
       this just keeps the on-screen box from looking stretched/squashed
       relative to them before the first frame draws. */
    aspect-ratio: 9/16;
    background: #000;
    border-radius: 4px;
    border: 1px solid var(--line);
    display: block;
  }
  .aspect-panel {
    width: 100%;
    max-width: 960px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
  }
  .aspect-panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .aspect-mode-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .aspect-mode-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
  }
  .aspect-mode-row input[type="radio"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    cursor: pointer;
    margin: 0;
  }
  .controls {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  @media (min-width: 960px) {
    body { padding: 24px 32px 40px; }
    .layout {
      flex-direction: row;
      align-items: flex-start;
      justify-content: center;
      gap: 28px;
      max-width: 1280px;
    }
    .stage-wrap {
      position: sticky;
      top: 24px;
      flex: 0 0 auto;
      align-self: flex-start;
    }
    canvas { width: min(400px, 34vw); }
    .controls-column {
      flex: 1 1 auto;
      min-width: 0;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: calc(100vh - 48px);
      overflow-y: auto;
      padding-right: 8px;
    }
  }
  @media (max-width: 620px) {
    .controls { gap: 8px; }
    .slot { padding: 7px; }
    .slot h2 { font-size: 9px; margin-bottom: 5px; }
    .file-btn { padding: 5px; font-size: 10px; }
    .filename { font-size: 9px; }
    .filter-row { gap: 3px; margin-top: 6px; }
    .filter-btn { padding: 4px 2px; font-size: 8px; }
    .zoom-row { margin-top: 6px; }
    .zoom-label { font-size: 9px; margin-bottom: 3px; }
    .zoom-row input[type="range"]::-webkit-slider-thumb { width: 13px; height: 13px; }
    .zoom-row input[type="range"]::-moz-range-thumb { width: 13px; height: 13px; }
    .trim-row { margin-top: 6px; }
    .trim-inputs input[type="number"] { padding: 4px 5px; font-size: 10px; }
    .trim-sep { font-size: 10px; }
    .output-mode-row { gap: 8px; }
    .output-mode-row label { font-size: 11px; }
  }
  .slot {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px;
    /* Grid items default to min-width: auto, which means a track can't
       shrink below its content's intrinsic minimum width - normally
       invisible, but the new speed <select> pushed that minimum past
       what a 1fr column has room for at narrow widths, blowing the grid
       out to double-width instead of the intended 2-column layout. */
    min-width: 0;
  }
  .slot h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 7px;
    font-weight: 600;
  }
  .file-btn {
    display: block;
    width: 100%;
    padding: 7px;
    background: #1e2126;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-size: 12px;
    text-align: center;
    cursor: pointer;
  }
  .file-input-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
    pointer-events: none;
  }
  .filename {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .filter-row {
    display: flex;
    gap: 5px;
    margin-top: 8px;
  }
  .filter-btn {
    flex: 1;
    padding: 5px 4px;
    background: #1e2126;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--muted);
    font-size: 10px;
    cursor: pointer;
    text-align: center;
  }
  .filter-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: #23262b;
  }
  .zoom-row {
    margin-top: 8px;
  }
  .zoom-label {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .zoom-label span {
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .zoom-row input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: #1e2126;
    border: 1px solid var(--line);
    outline: none;
    cursor: pointer;
  }
  .zoom-row input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .zoom-row input[type="range"]::-moz-range-thumb {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    cursor: pointer;
  }
  .trim-row {
    margin-top: 8px;
  }
  .trim-inputs {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .trim-inputs input[type="number"] {
    flex: 1;
    min-width: 0;
    padding: 5px 6px;
    background: #1e2126;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .trim-sep {
    color: var(--muted);
    font-size: 11px;
  }
  .speed-row {
    margin-top: 8px;
  }
  .speed-row select {
    width: 100%;
    padding: 6px;
    background: #1e2126;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
  }
  .transport {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: center;
  }
  button.main {
    padding: 11px 22px;
    background: var(--accent);
    color: #14151a;
    border: none;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.main:disabled {
    opacity: 0.35;
    cursor: default;
  }
  button.ghost {
    padding: 11px 18px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
  }
  .status {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    min-height: 12px;
  }
  .progress-wrap {
    width: 100%;
    max-width: 320px;
    height: 4px;
    background: #1e2126;
    border-radius: 2px;
    overflow: hidden;
    display: none;
  }
  .progress-wrap.active { display: block; }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.15s linear;
  }
  .audio-panel {
    width: 100%;
    max-width: 960px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
  }
  .audio-panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .audio-slots {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  @media (max-width: 620px) {
    .audio-slots { grid-template-columns: 1fr; }
  }
  .audio-slot {
    background: #1a1c20;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 8px;
  }
  .audio-radio-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .audio-radio-row input[type="radio"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    cursor: pointer;
    margin: 0;
  }
  .audio-radio-row label {
    font-size: 11px;
    color: var(--text);
    cursor: pointer;
  }
  .audio-slot .file-btn {
    padding: 6px;
    font-size: 11px;
  }
  .audio-slot .filename {
    margin-top: 4px;
  }
  .fade-toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .fade-toggle-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    cursor: pointer;
    margin: 0;
  }
  .audio-status {
    margin-top: 8px;
    font-size: 10px;
    color: var(--muted);
    min-height: 12px;
  }
  .output-panel {
    width: 100%;
    max-width: 960px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
  }
  .output-panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .output-mode-row {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  .output-mode-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
  }
  .output-mode-row input[type="radio"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    cursor: pointer;
    margin: 0;
  }
  .output-custom-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
  }
  .output-custom-row[hidden] {
    display: none;
  }
  .output-custom-row input[type="number"] {
    width: 70px;
    padding: 5px 6px;
    background: #1e2126;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
  .text-panel {
    width: 100%;
    max-width: 960px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px;
  }
  .text-panel h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin: 0 0 10px;
    font-weight: 600;
  }
  .text-panel textarea {
    width: 100%;
    resize: vertical;
    min-height: 44px;
    padding: 8px 10px;
    background: #1e2126;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-size: 12px;
    font-family: inherit;
    outline: none;
  }
  .text-panel textarea::placeholder {
    color: var(--muted);
  }
  .text-controls-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 10px;
  }
  @media (max-width: 620px) {
    .text-controls-grid { grid-template-columns: 1fr; }
  }
  .text-field label {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .text-field select {
    width: 100%;
    padding: 6px;
    background: #1e2126;
    border: 1px solid var(--line);
    border-radius: 4px;
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
  }
  .text-field input[type="color"] {
    width: 100%;
    height: 30px;
    padding: 2px;
    background: #1e2126;
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
  }
  .text-position-row {
    display: flex;
    gap: 12px;
  }
  .text-position-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text);
    cursor: pointer;
  }
  .text-position-row input[type="radio"] {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    cursor: pointer;
    margin: 0;
  }
  .text-bg-toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
  }
  .text-bg-toggle-row input[type="checkbox"] {
    accent-color: var(--accent);
    width: 15px;
    height: 15px;
    cursor: pointer;
    margin: 0;
  }
</style>
</head>
<body>

<div class="layout">
  <div class="stage-wrap">
    <canvas id="stage" width="1080" height="1920"></canvas>
    <div class="transport">
      <button class="ghost" id="playBtn" disabled>Play</button>
      <button class="main" id="exportBtn" disabled>Export MP4</button>
    </div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="status" id="status"></div>
  </div>

  <div class="controls-column">
  <div class="aspect-panel">
    <h2>Aspect ratio</h2>
    <div class="aspect-mode-row">
      <label><input type="radio" name="aspectRatio" value="9:16" checked> 9:16 (Reels/Stories)</label>
      <label><input type="radio" name="aspectRatio" value="1:1"> 1:1 (Square)</label>
      <label><input type="radio" name="aspectRatio" value="4:5"> 4:5 (Feed)</label>
    </div>
  </div>

  <div class="controls">
    <div class="slot">
      <h2>Top clip</h2>
      <label class="file-btn" id="fileTopBtn" for="fileTop">Choose video</label>
      <input type="file" id="fileTop" accept="video/*" class="file-input-hidden">
      <div class="filename" id="nameTop">No file selected</div>
      <div class="filter-row" data-slot="top">
        <div class="filter-btn active" data-filter="clean">Clean</div>
        <div class="filter-btn" data-filter="warm">Warm</div>
        <div class="filter-btn" data-filter="cool">Cool</div>
        <div class="filter-btn" data-filter="soft">Soft</div>
      </div>
      <div class="zoom-row">
        <label class="zoom-label" for="topZoom">Zoom <span id="topZoomValue">1.15x</span></label>
        <input type="range" id="topZoom" min="1" max="2" step="0.01" value="1.15">
      </div>
      <div class="zoom-row">
        <label class="zoom-label" for="topPan">Position <span id="topPanValue">Center</span></label>
        <input type="range" id="topPan" min="-1" max="1" step="0.01" value="0">
      </div>
      <div class="trim-row">
        <label class="zoom-label">Trim <span id="topTrimValue">0:00–0:00</span></label>
        <div class="trim-inputs">
          <input type="number" id="topTrimStart" min="0" step="0.1" value="0">
          <span class="trim-sep">–</span>
          <input type="number" id="topTrimEnd" min="0" step="0.1" value="0">
        </div>
      </div>
      <div class="speed-row">
        <label class="zoom-label" for="topSpeed">Speed</label>
        <select id="topSpeed">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
      <label class="fade-toggle-row">
        <input type="checkbox" id="topKeepAudio">
        <span>Keep original audio</span>
      </label>
      <div class="zoom-row" id="topAudioLevelRow" hidden>
        <label class="zoom-label" for="topAudioLevel">Level <span id="topAudioLevelValue">100%</span></label>
        <input type="range" id="topAudioLevel" min="0" max="1" step="0.01" value="1">
      </div>
    </div>

    <div class="slot">
      <h2>Bottom clip</h2>
      <label class="file-btn" id="fileBottomBtn" for="fileBottom">Choose video</label>
      <input type="file" id="fileBottom" accept="video/*" class="file-input-hidden">
      <div class="filename" id="nameBottom">No file selected</div>
      <div class="filter-row" data-slot="bottom">
        <div class="filter-btn active" data-filter="clean">Clean</div>
        <div class="filter-btn" data-filter="warm">Warm</div>
        <div class="filter-btn" data-filter="cool">Cool</div>
        <div class="filter-btn" data-filter="soft">Soft</div>
      </div>
      <div class="zoom-row">
        <label class="zoom-label" for="bottomZoom">Zoom <span id="bottomZoomValue">1.00x</span></label>
        <input type="range" id="bottomZoom" min="1" max="1.1" step="0.01" value="1">
      </div>
      <div class="zoom-row">
        <label class="zoom-label" for="bottomPan">Position <span id="bottomPanValue">Center</span></label>
        <input type="range" id="bottomPan" min="-1" max="1" step="0.01" value="0">
      </div>
      <div class="trim-row">
        <label class="zoom-label">Trim <span id="bottomTrimValue">0:00–0:00</span></label>
        <div class="trim-inputs">
          <input type="number" id="bottomTrimStart" min="0" step="0.1" value="0">
          <span class="trim-sep">–</span>
          <input type="number" id="bottomTrimEnd" min="0" step="0.1" value="0">
        </div>
      </div>
      <div class="speed-row">
        <label class="zoom-label" for="bottomSpeed">Speed</label>
        <select id="bottomSpeed">
          <option value="0.25">0.25x</option>
          <option value="0.5">0.5x</option>
          <option value="0.75">0.75x</option>
          <option value="1" selected>1x</option>
          <option value="1.5">1.5x</option>
          <option value="2">2x</option>
        </select>
      </div>
      <label class="fade-toggle-row">
        <input type="checkbox" id="bottomKeepAudio">
        <span>Keep original audio</span>
      </label>
      <div class="zoom-row" id="bottomAudioLevelRow" hidden>
        <label class="zoom-label" for="bottomAudioLevel">Level <span id="bottomAudioLevelValue">100%</span></label>
        <input type="range" id="bottomAudioLevel" min="0" max="1" step="0.01" value="1">
      </div>
    </div>
  </div>

  <div class="output-panel">
    <h2>Output length</h2>
    <div class="output-mode-row">
      <label><input type="radio" name="outputMode" value="shorter" checked> Match shorter clip</label>
      <label><input type="radio" name="outputMode" value="longer"> Match longer clip</label>
      <label><input type="radio" name="outputMode" value="custom"> Custom</label>
    </div>
    <div class="output-custom-row" id="outputCustomRow" hidden>
      <input type="number" id="outputCustomSeconds" min="1" max="60" step="0.5" value="6">
      <span>seconds</span>
    </div>
  </div>

  <div class="text-panel">
    <h2>Text overlay</h2>
    <textarea id="overlayText" rows="2" placeholder="Add a caption — leave empty to skip it"></textarea>
    <div class="text-controls-grid">
      <div class="text-field">
        <label for="overlayPosition">Position</label>
        <div class="text-position-row">
          <label><input type="radio" name="overlayPosition" value="top"> Top</label>
          <label><input type="radio" name="overlayPosition" value="middle"> Middle</label>
          <label><input type="radio" name="overlayPosition" value="bottom" checked> Bottom</label>
        </div>
      </div>
      <div class="text-field">
        <label for="overlayFont">Font</label>
        <select id="overlayFont">
          <option value="system">System sans</option>
          <option value="serif">Serif</option>
          <option value="mono">Mono</option>
          <option value="impact">Impact (caption style)</option>
        </select>
      </div>
      <div class="text-field">
        <label for="overlaySize">Size <span id="overlaySizeValue">54px</span></label>
        <input type="range" id="overlaySize" min="24" max="120" step="1" value="54">
      </div>
      <div class="text-field">
        <label for="overlayColor">Color</label>
        <input type="color" id="overlayColor" value="#ffffff">
      </div>
    </div>
    <label class="text-bg-toggle-row">
      <input type="checkbox" id="overlayBg" checked>
      <span>Semi-transparent background bar</span>
    </label>
  </div>

  <div class="audio-panel">
    <h2>Background music</h2>
    <div class="audio-slots">
      <div class="audio-slot">
        <div class="audio-radio-row">
          <input type="radio" name="audioTrack" id="audioTrackRadio0" value="0">
          <label for="audioTrackRadio0">Use this track</label>
        </div>
        <label class="file-btn" id="audio0Btn" for="audio0">Choose audio</label>
        <input type="file" id="audio0" accept="audio/*" class="file-input-hidden">
        <div class="filename" id="nameAudio0">No file selected</div>
      </div>
      <div class="audio-slot">
        <div class="audio-radio-row">
          <input type="radio" name="audioTrack" id="audioTrackRadio1" value="1">
          <label for="audioTrackRadio1">Use this track</label>
        </div>
        <label class="file-btn" id="audio1Btn" for="audio1">Choose audio</label>
        <input type="file" id="audio1" accept="audio/*" class="file-input-hidden">
        <div class="filename" id="nameAudio1">No file selected</div>
      </div>
      <div class="audio-slot">
        <div class="audio-radio-row">
          <input type="radio" name="audioTrack" id="audioTrackRadio2" value="2">
          <label for="audioTrackRadio2">Use this track</label>
        </div>
        <label class="file-btn" id="audio2Btn" for="audio2">Choose audio</label>
        <input type="file" id="audio2" accept="audio/*" class="file-input-hidden">
        <div class="filename" id="nameAudio2">No file selected</div>
      </div>
    </div>
    <label class="fade-toggle-row">
      <input type="checkbox" id="fadeToggle" checked>
      <span>Fade in/out (0.5s)</span>
    </label>
    <div class="zoom-row">
      <label class="zoom-label" for="musicLevel">Music level <span id="musicLevelValue">100%</span></label>
      <input type="range" id="musicLevel" min="0" max="1" step="0.01" value="1">
    </div>
    <div class="audio-status" id="audioStatus"></div>
  </div>
  </div>
</div>

<script>
// mp4-muxer is only loaded lazily, on export — never blocks the rest of the UI.
let MuxerLib = null;
async function getMuxerLib() {
  if (MuxerLib) return MuxerLib;
  MuxerLib = await import("https://cdn.jsdelivr.net/npm/mp4-muxer@5/build/mp4-muxer.mjs");
  return MuxerLib;
}

// Subtle, clean filter presets. All restrained on purpose — no heavy stylization.
const FILTERS = {
  clean: "contrast(1.02) saturate(1.02) brightness(1.005)",
  warm:  "contrast(1.015) saturate(0.98) sepia(0.05) brightness(1.01)",
  cool:  "contrast(1.015) saturate(0.97) brightness(0.995) hue-rotate(-3deg)",
  soft:  "blur(3px) brightness(0.82) contrast(0.94) saturate(0.9)"
};

const state = {
  top: { video: null, url: null, file: null, filter: "clean", ready: false, zoom: 1.15, panY: 0, duration: 0, trimStart: 0, trimEnd: 0, speed: 1, keepAudio: false, audioLevel: 1, decodedAudio: null },
  bottom: { video: null, url: null, file: null, filter: "clean", ready: false, zoom: 1, panY: 0, duration: 0, trimStart: 0, trimEnd: 0, speed: 1, keepAudio: false, audioLevel: 1, decodedAudio: null }
};

const MIN_TRIM_LENGTH = 0.5;

// How long a clip's trimmed segment actually plays for at its chosen
// speed - a 4s trim at 2x plays in 2s, at 0.5x it plays in 8s. This is
// what output-length math and looping should measure against, not the
// raw (end - start) trim length.
function effectiveTrimLength(slot) {
  return (slot.trimEnd - slot.trimStart) / slot.speed;
}

// Output length: "shorter"/"longer" derive it from each clip's own
// *effective* trimmed length (trim length adjusted for speed); "custom"
// uses a fixed seconds value instead. Whichever clip's effective length
// is shorter than this loops to fill it, and whichever is longer gets
// truncated - see sourceTimeFor in the export handler below for exactly
// how.
const outputState = { mode: "shorter", customSeconds: 6 };

function getOutputDuration() {
  const topLen = effectiveTrimLength(state.top);
  const bottomLen = effectiveTrimLength(state.bottom);
  if (outputState.mode === "longer") return Math.max(topLen, bottomLen);
  if (outputState.mode === "custom") return Math.max(1, Math.min(60, outputState.customSeconds));
  return Math.min(topLen, bottomLen);
}

// Text overlay: drawn onto the canvas at the end of drawFrame(), after
// both clips, so it's baked into every frame the same way for preview
// and export - no separate export-only code path needed. Font choices
// are limited to system-installed stacks on purpose: canvas text drawn
// before a web font finishes loading silently falls back with no error,
// so sticking to fonts that are always already available sidesteps that
// whole class of bug rather than needing FontFace/document.fonts.ready
// handling.
const FONT_STACKS = {
  system: `-apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif`,
  serif: `Georgia, "Times New Roman", serif`,
  mono: `"Courier New", monospace`,
  impact: `Impact, "Arial Narrow Bold", sans-serif`
};
const textOverlay = {
  text: "",
  position: "bottom", // "top" | "middle" | "bottom"
  font: "system",
  size: 54,
  color: "#ffffff",
  background: true
};

// Background music: 3 loadable tracks, one selected at a time. selectedIndex
// picks WHICH track; the tool then picks a random start point within it
// (startOffset) and renders that segment - trimmed to the video's exact
// length, with fades baked in if enabled - into renderedBuffer. Both preview
// playback and export read from that same renderedBuffer, so what you hear
// while previewing is exactly what gets encoded into the export.
const audioState = {
  tracks: [null, null, null],   // { file, decoded (AudioBuffer), name } per slot
  selectedIndex: null,
  fade: true,
  musicLevel: 1,
  startOffset: null,
  renderedBuffer: null
};

const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

// Canvas geometry is derived state, not fixed constants - aspect ratio
// presets change canvas.width/height at runtime (see applyAspectRatio),
// and everything below is recomputed from whatever those currently are.
let W, H, BAR_H, VIDEO_H, TOP_H, BOTTOM_H, BOTTOM_Y;

const ASPECT_RATIOS = {
  "9:16": { width: 1080, height: 1920 },
  "1:1": { width: 1080, height: 1080 },
  "4:5": { width: 1080, height: 1350 }
};

function applyAspectRatio(key) {
  const dims = ASPECT_RATIOS[key];
  if (!dims) return;
  canvas.width = dims.width;
  canvas.height = dims.height;
  canvas.style.aspectRatio = `${dims.width}/${dims.height}`;

  W = canvas.width;
  H = canvas.height;
  // A solid black divider between the two clips - 2% of canvas height
  // reads clearly as a deliberate gap without eating much frame. It
  // needs no dedicated draw call: drawFrame() fills the whole canvas
  // black first, so leaving this gap between the two drawHalf() calls
  // is enough.
  BAR_H = Math.round(H * 0.02);
  VIDEO_H = H - BAR_H;
  // Top gets 1/3 of the remaining video area, bottom the other 2/3 -
  // BOTTOM_H is derived as VIDEO_H - TOP_H (not VIDEO_H * 2/3) so the
  // two sections always add up to exactly VIDEO_H with no rounding gap.
  TOP_H = VIDEO_H / 3;
  BOTTOM_H = VIDEO_H - TOP_H;
  BOTTOM_Y = TOP_H + BAR_H;

  // drawHalf/drawFrame read W/H/TOP_H/etc fresh every call (nothing
  // caches stale geometry), so redrawing here is all a ratio switch
  // needs to re-run each clip's crop math against the new dimensions.
  if (state.top.ready && state.bottom.ready) drawFrame();
}
applyAspectRatio("9:16");

document.querySelectorAll('input[name="aspectRatio"]').forEach(radio => {
  radio.addEventListener("change", () => {
    if (radio.checked) applyAspectRatio(radio.value);
  });
});

const playBtn = document.getElementById("playBtn");
const exportBtn = document.getElementById("exportBtn");
const statusEl = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");

function setStatus(msg) { statusEl.textContent = msg || ""; }

function makeVideoEl() {
  const v = document.createElement("video");
  v.muted = true;
  v.playsInline = true;
  v.preload = "auto";
  v.style.position = "absolute";
  v.style.width = "1px";
  v.style.height = "1px";
  v.style.opacity = "0";
  v.style.pointerEvents = "none";
  document.body.appendChild(v);
  return v;
}

function loadFile(slotName, file) {
  const slot = state[slotName];
  setStatus(`Loading ${file.name}...`);
  document.getElementById(slotName === "top" ? "nameTop" : "nameBottom").textContent = file.name;

  if (slot.url) URL.revokeObjectURL(slot.url);
  if (slot.video) slot.video.remove();

  let url;
  try {
    url = URL.createObjectURL(file);
  } catch (err) {
    setStatus(`Couldn't read that file: ${err.message}`);
    return;
  }

  const v = makeVideoEl();
  slot.video = v;
  slot.url = url;
  slot.file = file;
  slot.ready = false;
  v.volume = slot.audioLevel;

  // A replaced file's audio may have nothing to do with the old one, so
  // "keep original audio" resets to off (and gets re-decoded fresh if the
  // user re-checks it) rather than silently carrying over - unlike speed,
  // which is a stylistic preference safe to keep across files.
  slot.keepAudio = false;
  slot.decodedAudio = null;
  const keepAudioBox = document.getElementById(slotName + "KeepAudio");
  const audioLevelRow = document.getElementById(slotName + "AudioLevelRow");
  if (keepAudioBox) keepAudioBox.checked = false;
  if (audioLevelRow) audioLevelRow.hidden = true;

  let settled = false;
  const markReady = () => {
    if (settled) return;
    settled = true;
    slot.ready = true;
    clearTimeout(watchdog);
    checkReady();
  };

  // Trim range resets fresh for every new file, including a re-upload
  // replacing the previous one - there's no case where a stale trim
  // range from a different clip should carry over onto a new duration.
  // Speed is a per-slot preference, not tied to any one file, so it's
  // re-applied to whatever video element is currently loaded rather than
  // reset - playbackRate lives on the <video> element itself and defaults
  // back to 1 on every fresh element otherwise.
  v.addEventListener("loadedmetadata", () => {
    slot.duration = v.duration;
    slot.trimStart = 0;
    slot.trimEnd = v.duration;
    v.playbackRate = slot.speed;
    updateTrimInputs(slotName);

    // The top slot's 1.15x default zoom is tuned for portrait sources -
    // its own section shape is fairly wide (close to 16:9) already, so a
    // landscape source needs barely any cropping to fill it (confirmed:
    // ~30px per side), and the extra zoom just cuts real top/bottom
    // framing that didn't need cutting. The bottom slot's 1.0 default
    // already works fine for either orientation, so only top needs this.
    if (slotName === "top") {
      const isLandscape = v.videoWidth > v.videoHeight;
      slot.zoom = isLandscape ? 1 : 1.15;
      topZoomInput.value = String(slot.zoom);
      topZoomValue.textContent = slot.zoom.toFixed(2) + "x";
    }
  });
  v.addEventListener("loadedmetadata", markReady);
  v.addEventListener("loadeddata", markReady);
  v.addEventListener("canplay", markReady);

  v.addEventListener("error", () => {
    if (settled) return;
    settled = true;
    clearTimeout(watchdog);
    const err = v.error;
    setStatus(`Couldn't load ${file.name} — ${err ? `error code ${err.code}: ${err.message}` : "unknown error"}.`);
  });

  const watchdog = setTimeout(() => {
    if (settled) return;
    setStatus(`Still stuck loading ${file.name} — readyState ${v.readyState}, networkState ${v.networkState}. Try a different file.`);
  }, 5000);

  v.src = url;
  v.load();
}

// Export needs both clips loaded *and* both trim ranges non-zero - the
// latter should always hold true by construction (trim inputs are
// clamped to a 0.5s minimum as soon as a clip's duration is known), but
// this is the single source of truth either way rather than trusting
// that invariant silently.
function updateExportAvailability() {
  const both = state.top.ready && state.bottom.ready;
  const topValid = (state.top.trimEnd - state.top.trimStart) > 0;
  const bottomValid = (state.bottom.trimEnd - state.bottom.trimStart) > 0;
  exportBtn.disabled = !(both && topValid && bottomValid);
}

function checkReady() {
  const both = state.top.ready && state.bottom.ready;
  playBtn.disabled = !both;
  updateExportAvailability();
  if (both) {
    drawFrame();
    setStatus("");
    refreshAudioSegment();
  } else if (state.top.ready && !state.bottom.ready) {
    // Without this, the status line is left showing whatever "Loading
    // ...' message came last - once the top clip finishes, that stale
    // text just sits there looking exactly like a stuck/frozen load,
    // even though loading actually succeeded and it's simply waiting on
    // the still-empty bottom slot (this tool needs both before it can
    // do anything - it's not broken, just not obviously waiting).
    setStatus("Top clip ready — choose a bottom clip to continue.");
  } else if (state.bottom.ready && !state.top.ready) {
    setStatus("Bottom clip ready — choose a top clip to continue.");
  }
}

// Draw current frame of both videos into their sections, filling without
// letterboxing (cover crop). `zoom` (>1) tightens the crop rectangle
// further on top of the base cover-crop, centered, so more of the
// section is filled by less of the source - a plain "zoom in" that
// keeps the same fill/aspect behavior, not a separate code path. `panY`
// (-1..1, 0 = centered) then slides that crop window up/down within
// whatever vertical slack is left between it and the full source frame
// - more zoom leaves more slack, so panning range grows with zoom. If a
// source is wide enough that the crop already uses the full source
// height (sh === vh, no vertical cropping happening at all), the slack
// is zero and panY has no effect - there's nothing to move within.
function drawHalf(video, filter, yOffset, sectionHeight, zoom = 1, panY = 0) {
  if (!video || video.readyState < 2) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const targetRatio = W / sectionHeight;
  const srcRatio = vw / vh;
  let sx, sy, sw, sh;
  if (srcRatio > targetRatio) {
    // source wider than target: crop sides
    sh = vh;
    sw = vh * targetRatio;
    sx = (vw - sw) / 2;
    sy = 0;
  } else {
    // source taller than target: crop top/bottom
    sw = vw;
    sh = vw / targetRatio;
    sx = 0;
    sy = (vh - sh) / 2;
  }
  if (zoom !== 1) {
    const zsw = sw / zoom;
    const zsh = sh / zoom;
    sx += (sw - zsw) / 2;
    sy += (sh - zsh) / 2;
    sw = zsw;
    sh = zsh;
  }
  if (panY !== 0) {
    const maxPanOffset = (vh - sh) / 2;
    sy = Math.max(0, Math.min(vh - sh, sy + panY * maxPanOffset));
  }
  ctx.save();
  ctx.filter = FILTERS[filter] || "none";
  ctx.drawImage(video, sx, sy, sw, sh, 0, yOffset, W, sectionHeight);
  ctx.restore();
}

// Draws the caption text on top of both clips, wrapping on explicit
// newlines only (not auto-wrapped to width) and centered horizontally.
// Position is inset ~10% of the canvas height from the top/bottom edge
// specifically so it clears where Instagram's own UI (captions, profile
// row, action buttons) tends to sit over Reels/Stories content.
function drawTextOverlay() {
  if (!textOverlay.text.trim()) return;
  const inset = H * 0.1;
  const fontPx = textOverlay.size;
  const lines = textOverlay.text.split("\n");
  const lineHeight = fontPx * 1.25;
  const blockHeight = lineHeight * lines.length;

  ctx.save();
  ctx.font = `700 ${fontPx}px ${FONT_STACKS[textOverlay.font] || FONT_STACKS.system}`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  let centerY;
  if (textOverlay.position === "top") centerY = inset + blockHeight / 2;
  else if (textOverlay.position === "bottom") centerY = H - inset - blockHeight / 2;
  else centerY = H / 2;

  if (textOverlay.background) {
    const padding = fontPx * 0.4;
    const maxLineWidth = Math.max(...lines.map(line => ctx.measureText(line).width));
    ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctx.fillRect(
      W / 2 - maxLineWidth / 2 - padding,
      centerY - blockHeight / 2 - padding,
      maxLineWidth + padding * 2,
      blockHeight + padding * 2
    );
  }

  ctx.fillStyle = textOverlay.color;
  lines.forEach((line, i) => {
    ctx.fillText(line, W / 2, centerY - blockHeight / 2 + lineHeight * (i + 0.5));
  });
  ctx.restore();
}

function drawFrame() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
  drawHalf(state.top.video, state.top.filter, 0, TOP_H, state.top.zoom, state.top.panY);
  drawHalf(state.bottom.video, state.bottom.filter, BOTTOM_Y, BOTTOM_H, state.bottom.zoom, state.bottom.panY);
  drawTextOverlay();
}

// --- Background music ---
const audioStatusEl = document.getElementById("audioStatus");
function setAudioStatus(msg) { audioStatusEl.textContent = msg || ""; }

function formatClock(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.round(sec % 60);
  return m + ":" + String(s).padStart(2, "0");
}

// Lazily created - browsers require a user gesture before an AudioContext
// will actually produce sound, and decodeAudioData doesn't need one, so
// there's no reason to create this until it's first needed.
let sharedAudioCtx = null;
function getAudioCtx() {
  if (!sharedAudioCtx) sharedAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return sharedAudioCtx;
}

// Renders the exact segment [startOffset, startOffset + duration) of
// `buffer` through an OfflineAudioContext, with a 0.5s linear fade in/out
// baked into the samples if `fade` is on. The result is always exactly
// `duration` seconds long (silence-padded by the source node if the track
// is too short to fill it), so it drops straight into both the preview
// player and the export encoder with no further trimming.
async function renderAudioSegment(buffer, startOffset, duration, fade, level) {
  const sampleRate = buffer.sampleRate;
  const channels = buffer.numberOfChannels;
  const offlineCtx = new OfflineAudioContext(channels, Math.ceil(duration * sampleRate), sampleRate);
  const src = offlineCtx.createBufferSource();
  src.buffer = buffer;
  const gain = offlineCtx.createGain();
  src.connect(gain);
  gain.connect(offlineCtx.destination);
  if (fade) {
    const fadeLen = Math.min(0.5, duration / 2);
    gain.gain.setValueAtTime(0, 0);
    gain.gain.linearRampToValueAtTime(level, fadeLen);
    gain.gain.setValueAtTime(level, Math.max(fadeLen, duration - fadeLen));
    gain.gain.linearRampToValueAtTime(0, duration);
  } else {
    gain.gain.setValueAtTime(level, 0);
  }
  src.start(0, startOffset, duration);
  return offlineCtx.startRendering();
}

let audioRenderToken = 0;

// Recomputes the rendered audio segment for the currently selected track,
// matched to the current output length (see getOutputDuration - trim and
// output-mode changes both affect this). Picks a fresh random start point
// only when explicitly asked to (a new track/file selection, or a fresh
// export) - a duration-only change (trim/output-length nudge) instead
// just clamps the *existing* start point so it still leaves enough of the
// track to cover the new length, rather than jumping to a different part
// of the song on every minor slider adjustment.
async function refreshAudioSegment(opts = {}) {
  const idx = audioState.selectedIndex;
  if (idx === null || !audioState.tracks[idx]) {
    audioState.renderedBuffer = null;
    setAudioStatus("");
    return;
  }
  if (!state.top.ready || !state.bottom.ready) return;

  const outputDuration = getOutputDuration();
  if (outputDuration <= 0) {
    audioState.renderedBuffer = null;
    setAudioStatus("");
    return;
  }

  const track = audioState.tracks[idx];
  const trackDuration = track.decoded.duration;
  const maxStart = Math.max(0, trackDuration - outputDuration);

  if (opts.forceNewStart || audioState.startOffset === null) {
    audioState.startOffset = maxStart > 0 ? Math.random() * maxStart : 0;
  } else {
    audioState.startOffset = Math.min(audioState.startOffset, maxStart);
  }

  const myToken = ++audioRenderToken;
  setAudioStatus("Rendering audio segment...");
  const rendered = await renderAudioSegment(track.decoded, audioState.startOffset, outputDuration, audioState.fade, audioState.musicLevel);
  if (myToken !== audioRenderToken) return; // superseded by a newer selection/track/fade/output change
  audioState.renderedBuffer = rendered;

  const shortNote = trackDuration < outputDuration ? " (track is shorter than the output length)" : "";
  setAudioStatus(`Using ${track.name}, ${formatClock(audioState.startOffset)}–${formatClock(audioState.startOffset + outputDuration)}${shortNote}`);

  // If a loop is already playing, hand it the freshly-rendered segment
  // right away instead of waiting for the next loop restart.
  if (playing) startAudioPreview();
}

// Shared by both a manual file pick and a default track finishing decode:
// select it automatically if nothing else is selected yet, or re-randomize
// the segment if it just replaced the currently-selected track.
function onTrackDecoded(idx) {
  const radio = document.getElementById("audioTrackRadio" + idx);
  if (audioState.selectedIndex === null) {
    radio.checked = true;
    audioState.selectedIndex = idx;
    refreshAudioSegment({ forceNewStart: true });
  } else if (audioState.selectedIndex === idx) {
    refreshAudioSegment({ forceNewStart: true });
  }
}

async function loadAudioFile(idx, file) {
  document.getElementById("nameAudio" + idx).textContent = file.name;
  setAudioStatus(`Decoding ${file.name}...`);
  try {
    const arrayBuffer = await file.arrayBuffer();
    const decoded = await getAudioCtx().decodeAudioData(arrayBuffer);
    audioState.tracks[idx] = { file, decoded, name: file.name };
  } catch (err) {
    document.getElementById("nameAudio" + idx).textContent = `${file.name} — couldn't decode this file`;
    return;
  }
  onTrackDecoded(idx);
}

// Three default tracks shipped in the repo (audio/) so the tool has music
// ready to go without requiring a file pick every time - "Choose audio"
// on any slot still overrides these with your own file. Loaded via
// fetch(), which only works when the page is served over http(s) (as it
// is on GitHub Pages) - opening the HTML file directly (file://) can't
// fetch local files at all, browsers block it, so these are skipped
// there and the slots just fall back to "Choose audio" as normal.
const DEFAULT_TRACKS = [
  { url: "audio/CloZee-Koto_Media.mp3", name: "CloZee — Koto" },
  { url: "audio/Eminem-Mockingbird-Lofi.mp3", name: "Mockingbird (Lofi)" },
  { url: "audio/Innerbloom.mp3", name: "Innerbloom" }
];

async function loadDefaultTrack(idx, url, name) {
  document.getElementById("nameAudio" + idx).textContent = `Loading ${name}...`;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const arrayBuffer = await resp.arrayBuffer();
    const decoded = await getAudioCtx().decodeAudioData(arrayBuffer);
    audioState.tracks[idx] = { file: null, decoded, name };
    document.getElementById("nameAudio" + idx).textContent = name;
  } catch (err) {
    document.getElementById("nameAudio" + idx).textContent = "No file selected";
    return;
  }
  onTrackDecoded(idx);
}
DEFAULT_TRACKS.forEach((t, idx) => loadDefaultTrack(idx, t.url, t.name));

[0, 1, 2].forEach(idx => {
  document.getElementById("audio" + idx).addEventListener("change", e => {
    if (e.target.files && e.target.files[0]) loadAudioFile(idx, e.target.files[0]);
  });
  document.getElementById("audioTrackRadio" + idx).addEventListener("change", () => {
    audioState.selectedIndex = idx;
    refreshAudioSegment({ forceNewStart: true });
  });
});

document.getElementById("fadeToggle").addEventListener("change", e => {
  audioState.fade = e.target.checked;
  refreshAudioSegment({ forceNewStart: false });
});

const musicLevelValue = document.getElementById("musicLevelValue");
document.getElementById("musicLevel").addEventListener("input", e => {
  audioState.musicLevel = parseFloat(e.target.value);
  musicLevelValue.textContent = Math.round(audioState.musicLevel * 100) + "%";
  refreshAudioSegment({ forceNewStart: false });
});

// --- Background music preview playback ---
// AudioBufferSourceNodes are one-shot (can't be restarted), so every
// (re)start of the loop gets a freshly-created node against the current
// renderedBuffer - which also means a segment that finished re-rendering
// mid-loop (see refreshAudioSegment above) gets picked up immediately.
let audioSourceNode = null;
function stopAudioPreview() {
  if (audioSourceNode) {
    try { audioSourceNode.stop(); } catch (err) { /* already stopped */ }
    audioSourceNode.disconnect();
    audioSourceNode = null;
  }
}
function startAudioPreview() {
  stopAudioPreview();
  if (!audioState.renderedBuffer) return;
  const ctx = getAudioCtx();
  if (ctx.state === "suspended") ctx.resume();
  const src = ctx.createBufferSource();
  src.buffer = audioState.renderedBuffer;
  src.connect(ctx.destination);
  // Each clip now loops independently within its own trim range (see
  // previewLoop below), so there's no single shared video-reset moment to
  // hang audio looping off of anymore - it just loops on its own natural
  // length instead, which is exactly the output length since that's what
  // it was rendered to. `onended` also fires from a manual .stop() (e.g.
  // pausing), so the identity check here is what stops that from
  // triggering an unwanted restart.
  src.onended = () => {
    if (audioSourceNode === src && playing) startAudioPreview();
  };
  src.start();
  audioSourceNode = src;
}

// --- File inputs ---
// fileTopBtn/fileBottomBtn are <label for="..."> elements pointing at
// their file inputs (see the markup above) - the browser opens the file
// picker natively from that association, no JS click-simulation needed.
// A button + element.click() on the hidden input is a known
// compatibility issue on some mobile browsers (confirmed: Android
// Chrome never opened the picker at all with that pattern).
document.getElementById("fileTop").addEventListener("change", e => {
  if (e.target.files && e.target.files[0]) {
    loadFile("top", e.target.files[0]);
  } else {
    setStatus("No file detected from picker — try again.");
  }
});
document.getElementById("fileBottom").addEventListener("change", e => {
  if (e.target.files && e.target.files[0]) {
    loadFile("bottom", e.target.files[0]);
  } else {
    setStatus("No file detected from picker — try again.");
  }
});

// Surface any runtime error instead of failing silently
window.addEventListener("error", (e) => {
  setStatus("Error: " + (e.message || "something went wrong"));
});

// --- Filter buttons ---
document.querySelectorAll(".filter-row").forEach(row => {
  const slotName = row.dataset.slot;
  row.querySelectorAll(".filter-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      row.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      state[slotName].filter = btn.dataset.filter;
      if (state.top.ready && state.bottom.ready) drawFrame();
    });
  });
});

// --- Top clip zoom ---
const topZoomInput = document.getElementById("topZoom");
const topZoomValue = document.getElementById("topZoomValue");
topZoomInput.addEventListener("input", () => {
  const zoom = parseFloat(topZoomInput.value);
  state.top.zoom = zoom;
  topZoomValue.textContent = zoom.toFixed(2) + "x";
  if (state.top.ready && state.bottom.ready) drawFrame();
});

// --- Bottom clip zoom ---
const bottomZoomInput = document.getElementById("bottomZoom");
const bottomZoomValue = document.getElementById("bottomZoomValue");
bottomZoomInput.addEventListener("input", () => {
  const zoom = parseFloat(bottomZoomInput.value);
  state.bottom.zoom = zoom;
  bottomZoomValue.textContent = zoom.toFixed(2) + "x";
  if (state.top.ready && state.bottom.ready) drawFrame();
});

// --- Vertical position (pan) - lets a clip be re-centered within its
// section's crop, e.g. to keep a subject's face in frame when the
// default centered crop cuts it off. Only has a visible effect once
// there's vertical crop slack to move within (see drawHalf's panY
// comment) - e.g. a wide/landscape clip that already shows its full
// height won't visibly move, since there's nothing to pan.
function formatPanLabel(pan) {
  if (Math.abs(pan) < 0.005) return "Center";
  const pct = Math.round(Math.abs(pan) * 100);
  return (pan < 0 ? "Up " : "Down ") + pct + "%";
}

const topPanInput = document.getElementById("topPan");
const topPanValue = document.getElementById("topPanValue");
topPanInput.addEventListener("input", () => {
  const pan = parseFloat(topPanInput.value);
  state.top.panY = pan;
  topPanValue.textContent = formatPanLabel(pan);
  if (state.top.ready && state.bottom.ready) drawFrame();
});

const bottomPanInput = document.getElementById("bottomPan");
const bottomPanValue = document.getElementById("bottomPanValue");
bottomPanInput.addEventListener("input", () => {
  const pan = parseFloat(bottomPanInput.value);
  state.bottom.panY = pan;
  bottomPanValue.textContent = formatPanLabel(pan);
  if (state.top.ready && state.bottom.ready) drawFrame();
});

// --- Per-clip trim range ---
function updateTrimLabel(slotName) {
  const slot = state[slotName];
  document.getElementById(slotName + "TrimValue").textContent =
    `${formatClock(slot.trimStart)}–${formatClock(slot.trimEnd)}`;
}

function updateTrimInputs(slotName) {
  const slot = state[slotName];
  const startInput = document.getElementById(slotName + "TrimStart");
  const endInput = document.getElementById(slotName + "TrimEnd");
  startInput.max = slot.duration.toFixed(1);
  endInput.max = slot.duration.toFixed(1);
  startInput.value = slot.trimStart.toFixed(1);
  endInput.value = slot.trimEnd.toFixed(1);
  updateTrimLabel(slotName);
}

// Seeks a (paused) video and redraws once the seek lands, so adjusting a
// trim handle gives immediate visual feedback on the canvas even while
// not playing - same pattern already used for zoom/pan, just via a seek
// first since trim needs a specific frame rather than the current one.
function seekAndRedraw(video, t) {
  const onSeeked = () => {
    video.removeEventListener("seeked", onSeeked);
    if (!playing) drawFrame();
  };
  video.addEventListener("seeked", onSeeked);
  video.currentTime = Math.max(0, Math.min(t, video.duration - 0.001));
}

// Clamps start < end with a minimum 0.5s gap (or the clip's whole
// duration if it's even shorter than that) - whichever handle was just
// edited "wins", pushing the other one along with it rather than
// silently refusing the edit.
function handleTrimChange(slotName, which) {
  const slot = state[slotName];
  const duration = slot.duration || 0;
  const startInput = document.getElementById(slotName + "TrimStart");
  const endInput = document.getElementById(slotName + "TrimEnd");
  const minLen = Math.min(MIN_TRIM_LENGTH, duration);

  let start = parseFloat(startInput.value);
  let end = parseFloat(endInput.value);
  if (Number.isNaN(start)) start = slot.trimStart;
  if (Number.isNaN(end)) end = slot.trimEnd;
  start = Math.max(0, Math.min(start, duration));
  end = Math.max(0, Math.min(end, duration));

  if (which === "start") {
    start = Math.min(start, duration - minLen);
    end = Math.max(end, start + minLen);
  } else {
    end = Math.max(end, minLen);
    start = Math.min(start, end - minLen);
  }
  start = Math.max(0, start);
  end = Math.min(duration, end);

  slot.trimStart = start;
  slot.trimEnd = end;
  startInput.value = start.toFixed(1);
  endInput.value = end.toFixed(1);
  updateTrimLabel(slotName);

  if (slot.video && slot.ready) {
    seekAndRedraw(slot.video, which === "start" ? start : Math.max(start, end - 0.05));
  }

  updateExportAvailability();
  if (state.top.ready && state.bottom.ready) refreshAudioSegment({ forceNewStart: false });
}

document.getElementById("topTrimStart").addEventListener("input", () => handleTrimChange("top", "start"));
document.getElementById("topTrimEnd").addEventListener("input", () => handleTrimChange("top", "end"));
document.getElementById("bottomTrimStart").addEventListener("input", () => handleTrimChange("bottom", "start"));
document.getElementById("bottomTrimEnd").addEventListener("input", () => handleTrimChange("bottom", "end"));

// --- Per-clip speed ---
// Only affects real-time preview playback directly (via playbackRate) -
// export is seek-driven, not real-time, so speed there is folded into
// sourceTimeFor's math instead (see the export handler). Audio pitch
// follows along automatically via the <video> element's own playbackRate
// when "keep original audio" is on (see below); otherwise it's moot since
// the element stays muted.
function handleSpeedChange(slotName) {
  const slot = state[slotName];
  const select = document.getElementById(slotName + "Speed");
  slot.speed = parseFloat(select.value) || 1;
  if (slot.video) slot.video.playbackRate = slot.speed;
  if (state.top.ready && state.bottom.ready) refreshAudioSegment({ forceNewStart: false });
}
document.getElementById("topSpeed").addEventListener("change", () => handleSpeedChange("top"));
document.getElementById("bottomSpeed").addEventListener("change", () => handleSpeedChange("bottom"));

// --- Per-clip original audio ---
// Live preview needs no offline rendering at all: the <video> elements
// already play in real time (see previewLoop), so simply unmuting one and
// setting its volume is enough to hear it in sync, at the right speed and
// looping within its own trim range, for free. Export is seek-driven
// (not real-time) so it can't capture that live playback - instead the
// exact same trim/speed/loop behavior is reproduced offline via
// AudioBufferSourceNode's loopStart/loopEnd/playbackRate, which is a
// precise match for sourceTimeFor's math (see buildFinalAudioBuffer).
async function decodeSlotAudio(slotName) {
  const slot = state[slotName];
  if (slot.decodedAudio || !slot.file) return slot.decodedAudio;
  setStatus(`Extracting audio from the ${slotName} clip...`);
  try {
    const arrayBuffer = await slot.file.arrayBuffer();
    slot.decodedAudio = await getAudioCtx().decodeAudioData(arrayBuffer);
    setStatus("");
  } catch (err) {
    console.error(err);
    slot.decodedAudio = null;
  }
  return slot.decodedAudio;
}

function setupKeepAudioControls(slotName) {
  const slot = state[slotName];
  const checkbox = document.getElementById(slotName + "KeepAudio");
  const levelRow = document.getElementById(slotName + "AudioLevelRow");
  const levelInput = document.getElementById(slotName + "AudioLevel");
  const levelValue = document.getElementById(slotName + "AudioLevelValue");

  checkbox.addEventListener("change", async e => {
    const checked = e.target.checked;
    levelRow.hidden = !checked;
    if (!checked) {
      slot.keepAudio = false;
      if (slot.video) slot.video.muted = true;
      return;
    }
    checkbox.disabled = true;
    const decoded = await decodeSlotAudio(slotName);
    checkbox.disabled = false;
    if (!decoded) {
      checkbox.checked = false;
      levelRow.hidden = true;
      setStatus(`Couldn't extract audio from the ${slotName} clip — it may have no audio track.`);
      return;
    }
    slot.keepAudio = true;
    if (slot.video) slot.video.muted = false;
  });

  levelInput.addEventListener("input", e => {
    slot.audioLevel = parseFloat(e.target.value);
    levelValue.textContent = Math.round(slot.audioLevel * 100) + "%";
    if (slot.video) slot.video.volume = slot.audioLevel;
  });
}
setupKeepAudioControls("top");
setupKeepAudioControls("bottom");

// --- Output length ---
document.getElementById("outputCustomRow").hidden = outputState.mode !== "custom";
document.querySelectorAll('input[name="outputMode"]').forEach(radio => {
  radio.addEventListener("change", () => {
    if (!radio.checked) return;
    outputState.mode = radio.value;
    document.getElementById("outputCustomRow").hidden = outputState.mode !== "custom";
    if (state.top.ready && state.bottom.ready) refreshAudioSegment({ forceNewStart: false });
  });
});

const outputCustomInput = document.getElementById("outputCustomSeconds");
outputCustomInput.addEventListener("input", () => {
  const v = parseFloat(outputCustomInput.value);
  if (!Number.isNaN(v)) outputState.customSeconds = Math.max(1, Math.min(60, v));
  if (state.top.ready && state.bottom.ready) refreshAudioSegment({ forceNewStart: false });
});

// --- Text overlay ---
function redrawIfReady() {
  if (state.top.ready && state.bottom.ready) drawFrame();
}

document.getElementById("overlayText").addEventListener("input", e => {
  textOverlay.text = e.target.value;
  redrawIfReady();
});
document.querySelectorAll('input[name="overlayPosition"]').forEach(radio => {
  radio.addEventListener("change", () => {
    if (radio.checked) {
      textOverlay.position = radio.value;
      redrawIfReady();
    }
  });
});
document.getElementById("overlayFont").addEventListener("change", e => {
  textOverlay.font = e.target.value;
  redrawIfReady();
});
const overlaySizeInput = document.getElementById("overlaySize");
const overlaySizeValue = document.getElementById("overlaySizeValue");
overlaySizeInput.addEventListener("input", () => {
  textOverlay.size = parseInt(overlaySizeInput.value, 10);
  overlaySizeValue.textContent = textOverlay.size + "px";
  redrawIfReady();
});
document.getElementById("overlayColor").addEventListener("input", e => {
  textOverlay.color = e.target.value;
  redrawIfReady();
});
document.getElementById("overlayBg").addEventListener("change", e => {
  textOverlay.background = e.target.checked;
  redrawIfReady();
});

// --- Preview playback ---
let playing = false;
let rafId = null;

// Each clip loops independently within its own trim range - whichever
// one reaches its trimEnd gets reset back to its own trimStart and kept
// playing, with no dependency on what the other clip is doing. (Audio
// loops separately too, on the output length - see startAudioPreview.)
function previewLoop() {
  if (state.top.video.currentTime >= state.top.trimEnd) {
    state.top.video.currentTime = state.top.trimStart;
    // Reaching its own natural end (trimEnd === the clip's real duration)
    // auto-pauses a video (standard <video> behavior) - resetting
    // currentTime alone doesn't resume it. .play() on an already-playing
    // video is a harmless no-op, so this is safe to call unconditionally.
    state.top.video.play();
  }
  if (state.bottom.video.currentTime >= state.bottom.trimEnd) {
    state.bottom.video.currentTime = state.bottom.trimStart;
    state.bottom.video.play();
  }
  drawFrame();
  if (playing) rafId = requestAnimationFrame(previewLoop);
}

playBtn.addEventListener("click", () => {
  if (!state.top.ready || !state.bottom.ready) return;
  playing = !playing;
  playBtn.textContent = playing ? "Pause" : "Play";
  if (playing) {
    state.top.video.currentTime = state.top.trimStart;
    state.bottom.video.currentTime = state.bottom.trimStart;
    state.top.video.play();
    state.bottom.video.play();
    startAudioPreview();
    previewLoop();
  } else {
    state.top.video.pause();
    state.bottom.video.pause();
    stopAudioPreview();
    cancelAnimationFrame(rafId);
  }
});

// Mixes together whichever audio sources are active - the background
// music track (already fade+level-rendered into audioState.renderedBuffer)
// and each clip's own original audio, if "keep original audio" is on for
// it - into a single `duration`-second buffer for the export encoder.
// Each clip's original audio is looped/speed-adjusted via
// AudioBufferSourceNode's loopStart/loopEnd/playbackRate, which reproduces
// sourceTimeFor's trim+speed+loop math exactly (same formula, just running
// on the audio timeline instead of being sampled once per video frame).
// Returns null if nothing is active, so export falls back to video-only,
// same as before any of this existed.
async function buildFinalAudioBuffer(duration) {
  const sources = [];
  if (audioState.renderedBuffer) {
    sources.push({ buffer: audioState.renderedBuffer, offset: 0 });
  }
  for (const slot of [state.top, state.bottom]) {
    if (!slot.keepAudio || !slot.decodedAudio) continue;
    const trimmedLength = slot.trimEnd - slot.trimStart;
    sources.push({
      buffer: slot.decodedAudio,
      offset: slot.trimStart,
      loop: trimmedLength > 0,
      loopStart: slot.trimStart,
      loopEnd: slot.trimEnd,
      playbackRate: slot.speed,
      gain: slot.audioLevel
    });
  }
  if (sources.length === 0) return null;

  const sampleRate = 48000;
  const channels = 2;
  const offlineCtx = new OfflineAudioContext(channels, Math.ceil(duration * sampleRate), sampleRate);
  for (const s of sources) {
    const src = offlineCtx.createBufferSource();
    src.buffer = s.buffer;
    if (s.loop) {
      src.loop = true;
      src.loopStart = s.loopStart;
      src.loopEnd = s.loopEnd;
    }
    if (s.playbackRate) src.playbackRate.value = s.playbackRate;
    const gain = offlineCtx.createGain();
    gain.gain.value = s.gain != null ? s.gain : 1;
    src.connect(gain);
    gain.connect(offlineCtx.destination);
    src.start(0, s.offset);
  }
  return offlineCtx.startRendering();
}

// --- Export (frame-accurate, seek-driven, via WebCodecs + mp4-muxer) ---
exportBtn.addEventListener("click", async () => {
  if (!state.top.ready || !state.bottom.ready) return;
  if (playing) { playBtn.click(); }

  if (typeof VideoEncoder === "undefined") {
    setStatus("This browser doesn't support the encoder needed for export. Try Chrome or Edge.");
    return;
  }

  // Firefox's WebCodecs VideoEncoder exists and *looks* usable, but
  // doesn't populate the same encoded-chunk metadata Chrome/Edge do
  // (confirmed: mp4-muxer crashes reading a colorSpace field Firefox
  // never fills in) - a real gap in Firefox's implementation, not
  // something fixable here. Caught upfront with a clear message rather
  // than letting it fail deep inside the encode loop with a raw error.
  if (/Firefox/i.test(navigator.userAgent)) {
    setStatus("Export isn't fully supported in Firefox yet (missing video metadata that Chrome/Edge provide) — please use Chrome or Edge to export.");
    return;
  }

  exportBtn.disabled = true;
  playBtn.disabled = true;
  progressWrap.classList.add("active");
  setStatus("Loading export library...");

  let Muxer, ArrayBufferTarget;
  try {
    const lib = await getMuxerLib();
    Muxer = lib.Muxer;
    ArrayBufferTarget = lib.ArrayBufferTarget;
  } catch (err) {
    console.error(err);
    setStatus("Couldn't load the export library (check your internet connection) — try again.");
    exportBtn.disabled = false;
    playBtn.disabled = false;
    progressWrap.classList.remove("active");
    return;
  }

  setStatus("Preparing export...");

  // Every export gets its own fresh random slice of the selected track,
  // not whatever segment preview happened to be using - otherwise
  // repeated exports in the same session would all reuse the same few
  // seconds of music instead of actually varying.
  if (audioState.selectedIndex !== null) {
    await refreshAudioSegment({ forceNewStart: true });
  }

  const fps = 30;
  const outputDuration = getOutputDuration();
  const frameCount = Math.max(1, Math.floor(outputDuration * fps));

  // Maps an overall output-timeline position `t` (0..outputDuration) to a
  // source-video time within [trimStart, trimEnd). `t * speed` converts
  // output-timeline seconds to source-timeline seconds first (2x speed
  // means 1s of output covers 2s of source - fast-forward; 0.5x means it
  // covers only 0.5s - slow motion), *then* wraps that within
  // trimmedLength: if the (speed-adjusted) trimmed clip is shorter than
  // the output, it wraps back around to loop and fill the remaining
  // time; if longer, elapsed source time never reaches trimmedLength so
  // this never wraps - it just plays straight through and gets
  // truncated at outputDuration. One formula covers both cases, same as
  // before speed existed (speed=1 reduces to the original math exactly).
  function sourceTimeFor(slot, t) {
    const trimmedLength = slot.trimEnd - slot.trimStart;
    if (trimmedLength <= 0) return slot.trimStart;
    const sourceElapsed = t * slot.speed;
    return slot.trimStart + (sourceElapsed % trimmedLength);
  }

  // Audio is only baked in if at least one source is active (background
  // music and/or a clip's kept original audio) - otherwise this exports
  // video-only, same as before any audio feature existed. Encoded fully
  // *before* the Muxer is created (and only added to its config on
  // success) so a mid-encode failure can't leave the Muxer declaring an
  // audio track it never actually receives samples for - AudioEncoder
  // failures are rare (Chrome that supports the VideoEncoder codec used
  // above supports AAC too) but a malformed output file isn't an
  // acceptable way to find that out.
  if (state.top.keepAudio && !state.top.decodedAudio) await decodeSlotAudio("top");
  if (state.bottom.keepAudio && !state.bottom.decodedAudio) await decodeSlotAudio("bottom");
  const audioBuffer = await buildFinalAudioBuffer(outputDuration);
  let hasAudio = false;
  let audioChunks = [];
  if (audioBuffer && typeof AudioEncoder !== "undefined") {
    setStatus("Encoding audio...");
    try {
      const audioEncoder = new AudioEncoder({
        output: (chunk, meta) => audioChunks.push({ chunk, meta }),
        error: (e) => console.error("Audio encode error:", e)
      });
      audioEncoder.configure({
        codec: "mp4a.40.2",
        numberOfChannels: audioBuffer.numberOfChannels,
        sampleRate: audioBuffer.sampleRate,
        bitrate: 128_000
      });

      const channelData = [];
      for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
        channelData.push(audioBuffer.getChannelData(c));
      }
      const FRAME_SIZE = 4096;
      for (let offset = 0; offset < audioBuffer.length; offset += FRAME_SIZE) {
        const frames = Math.min(FRAME_SIZE, audioBuffer.length - offset);
        const planar = new Float32Array(frames * audioBuffer.numberOfChannels);
        for (let c = 0; c < audioBuffer.numberOfChannels; c++) {
          planar.set(channelData[c].subarray(offset, offset + frames), c * frames);
        }
        const audioData = new AudioData({
          format: "f32-planar",
          sampleRate: audioBuffer.sampleRate,
          numberOfFrames: frames,
          numberOfChannels: audioBuffer.numberOfChannels,
          timestamp: Math.round((offset / audioBuffer.sampleRate) * 1_000_000),
          data: planar
        });
        audioEncoder.encode(audioData);
        audioData.close();
      }
      await audioEncoder.flush();
      hasAudio = true;
    } catch (err) {
      // Audio is a bonus on top of the video export, not a hard
      // requirement - if AAC encoding fails, fall back to a video-only
      // export rather than losing the whole clip over it.
      console.error(err);
      audioChunks = [];
      hasAudio = false;
    }
  }

  const muxerConfig = {
    target: new ArrayBufferTarget(),
    video: {
      codec: "avc",
      width: W,
      height: H
    },
    fastStart: "in-memory"
  };
  if (hasAudio) {
    muxerConfig.audio = {
      codec: "aac",
      numberOfChannels: audioBuffer.numberOfChannels,
      sampleRate: audioBuffer.sampleRate
    };
  }
  const muxer = new Muxer(muxerConfig);
  if (hasAudio) {
    for (const { chunk, meta } of audioChunks) muxer.addAudioChunk(chunk, meta);
  }

  const encoder = new VideoEncoder({
    output: (chunk, meta) => muxer.addVideoChunk(chunk, meta),
    error: (e) => {
      console.error(e);
      setStatus("Export failed: " + e.message);
    }
  });

  encoder.configure({
    codec: "avc1.640034",
    width: W,
    height: H,
    bitrate: 20_000_000,
    framerate: fps
  });

  async function seekTo(video, t) {
    return new Promise(resolve => {
      const onSeeked = () => { video.removeEventListener("seeked", onSeeked); resolve(); };
      video.addEventListener("seeked", onSeeked);
      video.currentTime = Math.min(t, video.duration - 0.001);
    });
  }

  try {
    for (let i = 0; i < frameCount; i++) {
      const t = i / fps;
      await Promise.all([
        seekTo(state.top.video, sourceTimeFor(state.top, t)),
        seekTo(state.bottom.video, sourceTimeFor(state.bottom, t))
      ]);
      drawFrame();

      const frame = new VideoFrame(canvas, {
        timestamp: Math.round((i / fps) * 1_000_000)
      });
      encoder.encode(frame, { keyFrame: i % (fps * 2) === 0 });
      frame.close();

      const pct = Math.round(((i + 1) / frameCount) * 100);
      progressBar.style.width = pct + "%";
      setStatus(`Encoding frame ${i + 1} / ${frameCount}`);

      // Yield to the UI thread periodically
      if (i % 4 === 0) await new Promise(r => setTimeout(r, 0));
    }

    setStatus("Finalizing file...");
    await encoder.flush();
    muxer.finalize();

    const { buffer } = muxer.target;
    const blob = new Blob([buffer], { type: "video/mp4" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "video-tool-export.mp4";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);

    setStatus("Done — file downloaded.");
  } catch (err) {
    console.error(err);
    // Same failure signature as the Firefox check above (a browser's
    // WebCodecs encoder not filling in decoderConfig/colorSpace that
    // mp4-muxer expects) - the Firefox check catches this ahead of time,
    // but this is a backstop in case some other browser (Safari's
    // WebCodecs support is also less mature than Chrome's) hits the same
    // gap, so it still gets a clear message instead of a raw JS error.
    if (/decoderConfig|colorSpace/i.test(err.message || "")) {
      setStatus("Export failed: this browser's video encoder is missing metadata this tool needs — please use Chrome or Edge to export.");
    } else {
      setStatus("Export failed: " + err.message);
    }
  } finally {
    exportBtn.disabled = false;
    playBtn.disabled = false;
    progressWrap.classList.remove("active");
    setTimeout(() => progressBar.style.width = "0%", 600);
  }
});
</script>
</body>
</html>
